<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi vida</title>
<style>
  body{margin:0;background:#08080f;color:white;font-family:serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  .luna{width:90px;height:90px;background:radial-gradient(circle at 30% 30%, #fff, #d1c7a5);border-radius:50%;box-shadow:0 0 40px #fff6;position:relative;margin-bottom:20px}
  .luna::after{content:'';position:absolute;width:100%;height:100%;background:#08080f;border-radius:50%;left:35%;top:0}
  h2{letter-spacing:4px;font-size:12px;color:#c9b896;margin:10px}
  #flor{font-size:90px;cursor:pointer;background:none;border:none;filter:drop-shadow(0 0 15px #ffeb3b);animation:latir 1.5s infinite}
  @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  #jardin{display:none;position:fixed;inset:0;background:#08080f;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center}
  #jardin.activa{display:flex}
  .foto{width:180px;height:180px;border-radius:50%;object-fit:cover;border:2px solid #ffeb3b;box-shadow:0 0 25px #ffeb3b88;margin:20px 0}
</style>
</head>
<body>
  <div class="luna"></div>
  <h2>PARA MI VIDA</h2>
  
  <button id="flor">🌼</button>
  <p style="margin-top:15px;font-size:14px;opacity:.8">Tócala, amor...</p>
  <p style="font-size:13px;max-width:250px;text-align:center;margin-top:30px;line-height:1.4">Que me haya demorado no significa que serás espectadora, mi vida 💗</p>

  <div id="jardin">
    <div style="font-size:40px">🌼💛🌼</div>
    <img src="assets/foto-adys.png" class="foto" onerror="this.style.display='none'">
    <h2 style="font-size:20px;color:#ffeb3b">Para ti, Adys</h2>
    <p style="max-width:300px">Estas flores amarillas son para ti, porque te amo y porque mereces todo lo bonito del mundo.</p>
    <p style="font-size:12px;opacity:.6;margin-top:20px">Toca de nuevo para volver</p>
  </div>

  <audio id="musica" src="assets/stand-by-me.mp4" loop preload="auto"></audio>

<script>
const flor = document.getElementById('flor');
const jardin = document.getElementById('jardin');
const musica = document.getElementById('musica');

function abrir(){
  musica.play().then(()=>{console.log("sonando")}).catch(e=>{alert("La música no se pudo reproducir: "+e)});
  jardin.classList.add('activa');
}

flor.addEventListener('click', abrir);
flor.addEventListener('touchstart', (e)=>{e.preventDefault(); abrir();});

jardin.addEventListener('click', ()=>{jardin.classList.remove('activa'); musica.pause();});
</script>
</body>
</html>
